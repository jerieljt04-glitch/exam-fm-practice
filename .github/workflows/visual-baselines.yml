name: Update visual baselines

# Run by hand after an intended design change: records the Linux screenshots
# the browser tests compare against and commits them to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright test -g visual --update-snapshots
      - name: Commit new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          git diff --cached --quiet || git commit -m "test: update Linux visual baselines"
          git push
